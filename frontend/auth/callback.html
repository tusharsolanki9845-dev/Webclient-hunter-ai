<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Completing Sign In – WebClient Hunter AI</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:linear-gradient(135deg,#EEF2FF 0%,#F5F3FF 50%,#E0F2FE 100%)}
    [data-theme="dark"] body{background:linear-gradient(135deg,#0F0F1A 0%,#1A1A2E 100%)}
    .callback-card{width:100%;max-width:440px;text-align:center;background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-xl);padding:40px;box-shadow:var(--shadow-lg)}
    .callback-icon{width:52px;height:52px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;background:var(--blue-50);color:var(--blue-600);font-size:1.4rem;font-weight:800}
    .callback-card p{margin:10px 0 0;color:var(--gray-500);font-size:.92rem;line-height:1.6}
    .callback-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}
  </style>
</head>
<body>
  <main class="callback-card" aria-live="polite">
    <div class="callback-icon" aria-hidden="true">↗</div>
    <h1 id="oauth-callback-title">Completing sign in</h1>
    <p id="oauth-callback-message">Your secure provider session is being verified.</p>
    <div class="callback-actions" id="oauth-callback-actions" hidden>
      <a href="../login" class="btn btn-primary">Return to sign in</a>
    </div>
  </main>
  <div class="toast-container" aria-live="polite"></div>
  <script src="../runtime-config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
